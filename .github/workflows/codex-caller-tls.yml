name: Apply caller-owned node TLS candidate
on: push
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/atrust-caller-tls-config
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.6"
      - name: Apply and validate focused TLS patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              p.write_text(text.replace(old, new))

          replace("client/atrust/client.go", '"crypto/rand"\n', '"crypto/rand"\n\t"crypto/tls"\n')
          replace("client/atrust/client.go", "type ClientOptions struct {\n\tSession         SessionOptions\n\tUnderlayDialer  client.UnderlayDialer\n\tTLSKeyLogWriter io.Writer\n}", "type ClientOptions struct {\n\tSession         SessionOptions\n\tUnderlayDialer  client.UnderlayDialer\n\tTLSKeyLogWriter io.Writer\n\tNodeTLSConfig   *tls.Config\n}")
          replace("client/atrust/client.go", "\tunderlayDialer   client.UnderlayDialer\n\ttlsKeyLogWriter  io.Writer\n\ttcpTunnelZeroRTT bool\n", "\tunderlayDialer   client.UnderlayDialer\n\ttlsKeyLogWriter  io.Writer\n\tnodeTLSConfig    *tls.Config\n\ttcpTunnelZeroRTT bool\n")
          replace("client/atrust/client.go", "\t\tunderlayDialer:  options.UnderlayDialer,\n\t\ttlsKeyLogWriter: options.TLSKeyLogWriter,\n\t\tlifecycleCtx:    lifecycleCtx,", "\t\tunderlayDialer:  options.UnderlayDialer,\n\t\ttlsKeyLogWriter: options.TLSKeyLogWriter,\n\t\tnodeTLSConfig:   cloneTLSConfig(options.NodeTLSConfig),\n\t\tlifecycleCtx:    lifecycleCtx,")
          replace("client/atrust/client.go", "c.BestNodes = getBestNodes(c.NodeGroups, c.underlayDialer.DialContext, c.tlsKeyLogWriter)", "c.BestNodes = getBestNodes(c.NodeGroups, c.underlayDialer.DialContext, c.tlsKeyLogWriter, c.nodeTLSConfig)")

          replace("client/atrust/tls.go", "func tlsConfig(config *tls.Config, keyLogWriter io.Writer) *tls.Config {", "func cloneTLSConfig(config *tls.Config) *tls.Config {\n\tif config == nil {\n\t\treturn nil\n\t}\n\treturn config.Clone()\n}\n\nfunc tlsConfig(config *tls.Config, keyLogWriter io.Writer) *tls.Config {")
          marker = "func tunnelTLSConfig(keyLogWriter io.Writer) *tls.Config {\n\treturn tlsConfig(&tls.Config{\n\t\tInsecureSkipVerify:     true,\n\t\tSessionTicketsDisabled: true,\n\t}, keyLogWriter)\n}\n"
          addition = marker + "\nfunc (c *Client) nodeTLSConfigForDial(base *tls.Config) *tls.Config {\n\tif c != nil && c.nodeTLSConfig != nil {\n\t\treturn tlsConfig(c.nodeTLSConfig, c.tlsKeyLogWriter)\n\t}\n\tif base != nil {\n\t\tif c == nil {\n\t\t\treturn tlsConfig(base, nil)\n\t\t}\n\t\treturn tlsConfig(base, c.tlsKeyLogWriter)\n\t}\n\tif c == nil {\n\t\treturn tunnelTLSConfig(nil)\n\t}\n\treturn tunnelTLSConfig(c.tlsKeyLogWriter)\n}\n"
          replace("client/atrust/tls.go", marker, addition)
          replace("client/atrust/ip.go", 'dialTLSContext(ctx, c.underlayDialer, "tcp", addr, tunnelTLSConfig(c.tlsKeyLogWriter))', 'dialTLSContext(ctx, c.underlayDialer, "tcp", addr, c.nodeTLSConfigForDial(nil))')
          replace("client/atrust/l3tunnel.go", "dialTLSContext(ctx, aTrustClient.underlayDialer, network, address, tlsConfig(config, aTrustClient.tlsKeyLogWriter))", "dialTLSContext(ctx, aTrustClient.underlayDialer, network, address, aTrustClient.nodeTLSConfigForDial(config))")
          replace("client/atrust/tcptunnel.go", 'dialTLSContext(ctx, c.underlayDialer, "tcp", nodeAddr, tunnelTLSConfig(c.tlsKeyLogWriter))', 'dialTLSContext(ctx, c.underlayDialer, "tcp", nodeAddr, c.nodeTLSConfigForDial(nil))')

          replace("client/atrust/node.go", '"context"\n\t"io"', '"context"\n\t"crypto/tls"\n\t"io"')
          replace("client/atrust/node.go", "func getBestNodes(nodeGroups map[string]NodeGroup, dialContext client.DialContextFunc, keyLogWriter io.Writer) map[string]string {\n\treturn selectBestNodes(nodeGroups, func(nodeGroups map[string][]string) map[string]string {\n\t\treturn getBestReachableNodes(nodeGroups, dialContext, keyLogWriter)\n\t})\n}", "func getBestNodes(nodeGroups map[string]NodeGroup, dialContext client.DialContextFunc, keyLogWriter io.Writer, nodeTLSConfig *tls.Config) map[string]string {\n\treturn selectBestNodes(nodeGroups, func(nodeGroups map[string][]string) map[string]string {\n\t\treturn getBestReachableNodes(nodeGroups, dialContext, keyLogWriter, nodeTLSConfig)\n\t})\n}")
          replace("client/atrust/node.go", "func getBestReachableNodes(nodeGroups map[string][]string, dialContext client.DialContextFunc, keyLogWriter io.Writer) map[string]string {", "func getBestReachableNodes(nodeGroups map[string][]string, dialContext client.DialContextFunc, keyLogWriter io.Writer, nodeTLSConfig *tls.Config) map[string]string {")
          replace("client/atrust/node.go", "\t\t\t\ttcping.SetDialContext(dialContext)\n\t\t\t\ttcping.SetKeyLogWriter(keyLogWriter)\n", "\t\t\t\ttcping.SetDialContext(dialContext)\n\t\t\t\ttcping.SetKeyLogWriter(keyLogWriter)\n\t\t\t\ttcping.SetTLSConfig(nodeTLSConfig)\n")
          replace("client/atrust/node.go", "bestNodes := getBestNodes(c.NodeGroups, c.underlayDialer.DialContext, c.tlsKeyLogWriter)", "bestNodes := getBestNodes(c.NodeGroups, c.underlayDialer.DialContext, c.tlsKeyLogWriter, c.nodeTLSConfig)")

          replace("internal/ping/tcp.go", "\tdial   client.DialContextFunc\n\tkeyLog io.Writer\n", "\tdial      client.DialContextFunc\n\tkeyLog    io.Writer\n\ttlsConfig *tls.Config\n")
          marker = "func (tcping *TCPing) SetKeyLogWriter(writer io.Writer) {\n\ttcping.keyLog = writer\n}\n"
          addition = marker + "\nfunc (tcping *TCPing) SetTLSConfig(config *tls.Config) {\n\tif config == nil {\n\t\ttcping.tlsConfig = nil\n\t\treturn\n\t}\n\ttcping.tlsConfig = config.Clone()\n}\n\nfunc (tcping *TCPing) tlsConfigForTarget() *tls.Config {\n\tif tcping.tlsConfig == nil {\n\t\treturn &tls.Config{ServerName: tcping.target.Host, InsecureSkipVerify: true, KeyLogWriter: tcping.keyLog}\n\t}\n\tconfig := tcping.tlsConfig.Clone()\n\tif config.ServerName == \"\" {\n\t\tconfig.ServerName = tcping.target.Host\n\t}\n\tif tcping.keyLog != nil {\n\t\tconfig.KeyLogWriter = tcping.keyLog\n\t}\n\treturn config\n}\n"
          replace("internal/ping/tcp.go", marker, addition)
          old = "\ttlsConn := tls.Client(conn, &tls.Config{\n\t\tServerName:         tcping.target.Host,\n\t\tInsecureSkipVerify: true,\n\t\tKeyLogWriter:       tcping.keyLog,\n\t})"
          replace("internal/ping/tcp.go", old, "\ttlsConn := tls.Client(conn, tcping.tlsConfigForTarget())")

          Path("client/atrust/tls_config_test.go").write_text("package atrust\n\nimport (\n\t\"crypto/tls\"\n\t\"testing\"\n)\n\nfunc TestNodeTLSConfigDefaultsToOfficialClientPolicy(t *testing.T) {\n\tc := NewClient(ClientOptions{})\n\tgot := c.nodeTLSConfigForDial(nil)\n\tif !got.InsecureSkipVerify || !got.SessionTicketsDisabled {\n\t\tt.Fatalf(\"unexpected default node TLS config: %+v\", got)\n\t}\n}\n\nfunc TestNodeTLSConfigIsCloned(t *testing.T) {\n\toriginal := &tls.Config{InsecureSkipVerify: true, ServerName: \"node.example\"}\n\tc := NewClient(ClientOptions{NodeTLSConfig: original})\n\toriginal.ServerName = \"mutated.example\"\n\tfirst := c.nodeTLSConfigForDial(nil)\n\tif first.ServerName != \"node.example\" {\n\t\tt.Fatalf(\"caller mutation leaked: %q\", first.ServerName)\n\t}\n\tfirst.ServerName = \"returned.example\"\n\tif got := c.nodeTLSConfigForDial(nil).ServerName; got != \"node.example\" {\n\t\tt.Fatalf(\"returned mutation leaked: %q\", got)\n\t}\n}\n")
          Path("internal/ping/tcp_tls_config_test.go").write_text("package ping\n\nimport (\n\t\"crypto/tls\"\n\t\"testing\"\n)\n\nfunc TestTCPingTLSConfigDefaultAndClone(t *testing.T) {\n\tp := NewTCPing()\n\tp.SetTarget(&Target{Host: \"node.example\"})\n\tif got := p.tlsConfigForTarget(); !got.InsecureSkipVerify || got.ServerName != \"node.example\" {\n\t\tt.Fatalf(\"unexpected default TLS config: %+v\", got)\n\t}\n\tcustom := &tls.Config{InsecureSkipVerify: true, ServerName: \"pinned.example\"}\n\tp.SetTLSConfig(custom)\n\tcustom.ServerName = \"mutated.example\"\n\tif got := p.tlsConfigForTarget().ServerName; got != \"pinned.example\" {\n\t\tt.Fatalf(\"TLS config was not cloned: %q\", got)\n\t}\n}\n")
          PY
          gofmt -w client/atrust/client.go client/atrust/tls.go client/atrust/ip.go client/atrust/l3tunnel.go client/atrust/node.go client/atrust/tcptunnel.go client/atrust/tls_config_test.go internal/ping/tcp.go internal/ping/tcp_tls_config_test.go
          git diff --check
          go test ./client/atrust/... ./internal/ping
          go vet ./client/atrust/... ./internal/ping
      - name: Commit validated candidate
        shell: bash
        run: |
          rm -f .github/workflows/codex-caller-tls.yml .github/codex-tls-trigger
          git config user.name "Cedar17"
          git config user.email "108384960+Cedar17@users.noreply.github.com"
          git add -A
          git commit -m "feat(atrust): allow caller-owned node TLS config"
          git push origin HEAD:feat/atrust-caller-tls-config
