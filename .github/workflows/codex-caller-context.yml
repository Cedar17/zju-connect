name: Apply caller-owned context candidate
on: push
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/atrust-caller-context
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.6"
      - name: Apply and validate context patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              p.write_text(text.replace(old, new))

          replace('client/atrust/auth/auth.go', 'import (\n\t"crypto/tls"', 'import (\n\t"context"\n\t"crypto/tls"')
          old = "func NewSession(server string, tlsKeyLogWriter io.Writer, dialContext ...client.DialContextFunc) *Session {\n\ttr := &http.Transport{\n\t\tTLSClientConfig: &tls.Config{\n\t\t\tInsecureSkipVerify: true,\n\t\t\tKeyLogWriter:       tlsKeyLogWriter,\n\t\t},\n\t}\n\tif len(dialContext) > 0 && dialContext[0] != nil {\n\t\ttr.DialContext = dialContext[0]\n\t}\n\tjar, _ := cookiejar.New(nil)\n\tclient := &http.Client{Transport: tr, Jar: jar, Timeout: 20 * time.Second}\n\n\treturn &Session{\n\t\tclient:   client,\n\t\tbaseHost: server,\n\t\tbaseURL:  \"https://\" + server,\n\t\trid:      base64.StdEncoding.EncodeToString([]byte(server)),\n\t\tresponse: make(map[string]json.RawMessage),\n\t}\n}\n"
          new = "type sessionContextRoundTripper struct {\n\tctx  context.Context\n\tbase http.RoundTripper\n}\n\nfunc (t sessionContextRoundTripper) RoundTrip(req *http.Request) (*http.Response, error) {\n\tctx := t.ctx\n\tif ctx == nil {\n\t\tctx = context.Background()\n\t}\n\treturn t.base.RoundTrip(req.Clone(ctx))\n}\n\nfunc NewSession(server string, tlsKeyLogWriter io.Writer, dialContext ...client.DialContextFunc) *Session {\n\treturn NewSessionContext(context.Background(), server, tlsKeyLogWriter, dialContext...)\n}\n\nfunc NewSessionContext(ctx context.Context, server string, tlsKeyLogWriter io.Writer, dialContext ...client.DialContextFunc) *Session {\n\tif ctx == nil {\n\t\tctx = context.Background()\n\t}\n\ttr := &http.Transport{\n\t\tTLSClientConfig: &tls.Config{\n\t\t\tInsecureSkipVerify: true,\n\t\t\tKeyLogWriter:       tlsKeyLogWriter,\n\t\t},\n\t}\n\tif len(dialContext) > 0 && dialContext[0] != nil {\n\t\ttr.DialContext = dialContext[0]\n\t}\n\tjar, _ := cookiejar.New(nil)\n\thttpClient := &http.Client{\n\t\tTransport: sessionContextRoundTripper{ctx: ctx, base: tr},\n\t\tJar:       jar,\n\t\tTimeout:   20 * time.Second,\n\t}\n\n\treturn &Session{\n\t\tclient:   httpClient,\n\t\tbaseHost: server,\n\t\tbaseURL:  \"https://\" + server,\n\t\trid:      base64.StdEncoding.EncodeToString([]byte(server)),\n\t\tresponse: make(map[string]json.RawMessage),\n\t}\n}\n"
          replace('client/atrust/auth/auth.go', old, new)

          replace('client/atrust/client.go', 'func (c *Client) Setup(options SetupOptions) ([]byte, error) {\n\tif c.underlayDialer == nil {', 'func (c *Client) Setup(options SetupOptions) ([]byte, error) {\n\treturn c.SetupContext(context.Background(), options)\n}\n\nfunc (c *Client) SetupContext(ctx context.Context, options SetupOptions) ([]byte, error) {\n\tif ctx == nil {\n\t\tctx = context.Background()\n\t}\n\tsetupCtx, cancelSetup := context.WithCancel(ctx)\n\tdefer cancelSetup()\n\tstopLifecycleCancellation := context.AfterFunc(c.lifecycleCtx, cancelSetup)\n\tdefer stopLifecycleCancellation()\n\tif err := setupCtx.Err(); err != nil {\n\t\treturn nil, err\n\t}\n\tif c.underlayDialer == nil {')
          replace('client/atrust/client.go', '\tsess := auth.NewSession(authServerHost, c.tlsKeyLogWriter, c.underlayDialer.DialContext)', '\tsess := auth.NewSessionContext(setupCtx, authServerHost, c.tlsKeyLogWriter, c.underlayDialer.DialContext)')
          replace('client/atrust/client.go', '\tc.BestNodes = getBestNodes(c.NodeGroups, c.underlayDialer.DialContext, c.tlsKeyLogWriter)\n\n\terr = c.getIP()', '\tc.BestNodes = getBestNodes(setupCtx, c.NodeGroups, c.underlayDialer.DialContext, c.tlsKeyLogWriter)\n\tif err := setupCtx.Err(); err != nil {\n\t\treturn nil, err\n\t}\n\n\terr = c.getIP(setupCtx)')
          replace('client/atrust/client.go', '\tl3Tunnel, err := NewL3Tunnel(c)', '\tif err := setupCtx.Err(); err != nil {\n\t\treturn nil, err\n\t}\n\tl3Tunnel, err := NewL3Tunnel(c)')

          replace('client/atrust/ip.go', 'func (c *Client) getIP() error {', 'func (c *Client) getIP(parent context.Context) error {')
          replace('client/atrust/ip.go', '\tctx, cancel := context.WithTimeout(context.Background(), 10*time.Second)', '\tif parent == nil {\n\t\tparent = context.Background()\n\t}\n\tctx, cancel := context.WithTimeout(parent, 10*time.Second)')

          replace('client/atrust/node.go', 'func getBestNodes(nodeGroups map[string]NodeGroup, dialContext client.DialContextFunc, keyLogWriter io.Writer) map[string]string {\n\treturn selectBestNodes(nodeGroups, func(nodeGroups map[string][]string) map[string]string {\n\t\treturn getBestReachableNodes(nodeGroups, dialContext, keyLogWriter)\n\t})\n}', 'func getBestNodes(ctx context.Context, nodeGroups map[string]NodeGroup, dialContext client.DialContextFunc, keyLogWriter io.Writer) map[string]string {\n\treturn selectBestNodes(nodeGroups, func(nodeGroups map[string][]string) map[string]string {\n\t\treturn getBestReachableNodes(ctx, nodeGroups, dialContext, keyLogWriter)\n\t})\n}')
          replace('client/atrust/node.go', 'func getBestReachableNodes(nodeGroups map[string][]string, dialContext client.DialContextFunc, keyLogWriter io.Writer) map[string]string {', 'func getBestReachableNodes(ctx context.Context, nodeGroups map[string][]string, dialContext client.DialContextFunc, keyLogWriter io.Writer) map[string]string {\n\tif ctx == nil {\n\t\tctx = context.Background()\n\t}')
          replace('client/atrust/node.go', '\t\t\t\tch := tcping.Start()', '\t\t\t\tch := tcping.StartWithContext(ctx)')
          replace('client/atrust/node.go', '\t\tbestNodes := getBestNodes(c.NodeGroups, c.underlayDialer.DialContext, c.tlsKeyLogWriter)', '\t\tbestNodes := getBestNodes(ctx, c.NodeGroups, c.underlayDialer.DialContext, c.tlsKeyLogWriter)')

          Path('client/atrust/auth/session_context_test.go').write_text('package auth\n\nimport (\n\t\"context\"\n\t\"errors\"\n\t\"net/http\"\n\t\"testing\"\n\t\"time\"\n)\n\ntype blockingRoundTripper struct{}\n\nfunc (blockingRoundTripper) RoundTrip(req *http.Request) (*http.Response, error) {\n\t<-req.Context().Done()\n\treturn nil, req.Context().Err()\n}\n\nfunc TestSessionContextRoundTripperCancelsRequest(t *testing.T) {\n\tctx, cancel := context.WithCancel(context.Background())\n\ttransport := sessionContextRoundTripper{ctx: ctx, base: blockingRoundTripper{}}\n\treq, err := http.NewRequest(http.MethodGet, \"https://example.invalid\", nil)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tdone := make(chan error, 1)\n\tgo func() {\n\t\t_, err := transport.RoundTrip(req)\n\t\tdone <- err\n\t}()\n\tcancel()\n\tselect {\n\tcase err := <-done:\n\t\tif !errors.Is(err, context.Canceled) {\n\t\t\tt.Fatalf(\"got %v, want context.Canceled\", err)\n\t\t}\n\tcase <-time.After(time.Second):\n\t\tt.Fatal(\"request did not observe session cancellation\")\n\t}\n}\n')
          Path('client/atrust/setup_context_test.go').write_text('package atrust\n\nimport (\n\t\"context\"\n\t\"errors\"\n\t\"net\"\n\t\"testing\"\n\t\"time\"\n)\n\ntype blockingUnderlayDialer struct{}\n\nfunc (blockingUnderlayDialer) DialContext(ctx context.Context, network, address string) (net.Conn, error) {\n\t<-ctx.Done()\n\treturn nil, ctx.Err()\n}\n\nfunc (blockingUnderlayDialer) ExcludeIP(net.IP) {}\n\nfunc TestSetupContextCancellationReachesManifestDial(t *testing.T) {\n\tclient := NewClient(ClientOptions{UnderlayDialer: blockingUnderlayDialer{}})\n\tctx, cancel := context.WithCancel(context.Background())\n\tdone := make(chan error, 1)\n\tgo func() {\n\t\t_, err := client.SetupContext(ctx, SetupOptions{ServerAddress: \"vpn.example\", ServerPort: 443})\n\t\tdone <- err\n\t}()\n\ttime.Sleep(20 * time.Millisecond)\n\tcancel()\n\tselect {\n\tcase err := <-done:\n\t\tif !errors.Is(err, context.Canceled) {\n\t\t\tt.Fatalf(\"got %v, want context.Canceled\", err)\n\t\t}\n\tcase <-time.After(time.Second):\n\t\tt.Fatal(\"SetupContext did not cancel in-flight manifest dial\")\n\t}\n}\n\nfunc TestClientCloseCancelsSetupContext(t *testing.T) {\n\tclient := NewClient(ClientOptions{UnderlayDialer: blockingUnderlayDialer{}})\n\tdone := make(chan error, 1)\n\tgo func() {\n\t\t_, err := client.SetupContext(context.Background(), SetupOptions{ServerAddress: \"vpn.example\", ServerPort: 443})\n\t\tdone <- err\n\t}()\n\ttime.Sleep(20 * time.Millisecond)\n\tclient.Close()\n\tselect {\n\tcase err := <-done:\n\t\tif !errors.Is(err, context.Canceled) {\n\t\t\tt.Fatalf(\"got %v, want context.Canceled\", err)\n\t\t}\n\tcase <-time.After(time.Second):\n\t\tt.Fatal(\"Client.Close did not cancel in-flight setup\")\n\t}\n}\n')
          PY
          gofmt -w client/atrust/auth/auth.go client/atrust/client.go client/atrust/ip.go client/atrust/node.go client/atrust/auth/session_context_test.go client/atrust/setup_context_test.go
          git diff --check
          go test ./client/atrust/... ./internal/ping
          go vet ./client/atrust/... ./internal/ping
      - name: Commit validated candidate
        shell: bash
        run: |
          rm .github/workflows/codex-caller-context.yml
          git config user.name "Cedar17"
          git config user.email "108384960+Cedar17@users.noreply.github.com"
          git add -A
          git commit -m "feat(atrust): add caller-owned setup context"
          git push origin HEAD:feat/atrust-caller-context
